name: Landing contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Validate landing page
        run: bash scripts/tests/landing-contract-test.sh
