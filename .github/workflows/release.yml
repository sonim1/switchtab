name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: "release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
      cancel-in-progress: false
    env:
      RELEASE_TAG: "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
      NOTARYTOOL_KEYCHAIN_PROFILE: switchtab-ci-notary
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "refs/tags/${{ env.RELEASE_TAG }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Release tag must match v<version>" >&2
            exit 64
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "Exact release tag does not exist: $tag_ref" >&2
            exit 64
          fi
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Checked-out HEAD does not match $RELEASE_TAG" >&2
            exit 64
          fi

          marketing_version="$(
            /usr/bin/xcrun xcodebuild \
              -project SwitchTab.xcodeproj \
              -scheme SwitchTab \
              -configuration Release \
              -showBuildSettings \
              | /usr/bin/awk '/^[[:space:]]*MARKETING_VERSION = / && !found { version = $3; found = 1 } END { if (found) print version }'
          )"
          if [[ -z "$marketing_version" || "${RELEASE_TAG#v}" != "$marketing_version" ]]; then
            echo "Release tag version does not match project MARKETING_VERSION" >&2
            exit 64
          fi

          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          fi
          git rev-parse --verify origin/main >/dev/null
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag commit is not on origin/main" >&2
            exit 64
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"

      - name: Install release tooling
        shell: bash
        run: npm ci --ignore-scripts

      - name: Run release contract tests
        shell: bash
        run: |
          set -euo pipefail
          release_tests=(
            scripts/tests/release-tooling-test.sh
            scripts/tests/release-local-test.sh
            scripts/tests/generate-appcast-test.sh
            scripts/tests/setup-update-hosting-test.sh
            scripts/tests/publish-update-test.sh
            scripts/tests/publish-release-test.sh
            scripts/tests/release-workflow-test.sh
          )
          for test_script in "${release_tests[@]}"; do
            bash "$test_script"
          done

      - name: Run Swift tests
        shell: bash
        run: swift test

      - name: Build unsigned Debug app
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            xcodebuild \
              -project SwitchTab.xcodeproj \
              -scheme SwitchTab \
              -configuration Debug \
              -destination 'platform=macOS,arch=arm64' \
              CODE_SIGNING_ALLOWED=NO \
              build

      - name: Prepare signing workspace
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          signing_temp_dir="$(mktemp -d "$RUNNER_TEMP/switchtab-release.XXXXXX")"
          keychain_path="$signing_temp_dir/switchtab-release.keychain-db"
          printf 'SIGNING_TEMP_DIR=%s\n' "$signing_temp_dir" >> "$GITHUB_ENV"
          printf 'NOTARYTOOL_KEYCHAIN_PATH=%s\n' "$keychain_path" >> "$GITHUB_ENV"

      - name: Install Apple credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}"
          APPLE_CERTIFICATE_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          APPLE_NOTARY_KEY_P8_BASE64: "${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}"
          APPLE_NOTARY_KEY_ID: "${{ secrets.APPLE_NOTARY_KEY_ID }}"
          APPLE_NOTARY_ISSUER_ID: "${{ secrets.APPLE_NOTARY_ISSUER_ID }}"
        run: |
          set -euo pipefail
          set +x

          SIGNING_TEMP_DIR="${SIGNING_TEMP_DIR:-}"
          NOTARYTOOL_KEYCHAIN_PATH="${NOTARYTOOL_KEYCHAIN_PATH:-}"
          runner_temp="${RUNNER_TEMP:-}"
          if [[ -z "$runner_temp" || -z "$SIGNING_TEMP_DIR" || -z "$NOTARYTOOL_KEYCHAIN_PATH" ]]; then
            echo "Prepared signing workspace is missing" >&2
            exit 64
          fi
          signing_basename="${SIGNING_TEMP_DIR#"$runner_temp"/}"
          if [[ ! "$signing_basename" =~ ^switchtab-release[.][A-Za-z0-9]{6}$ \
            || "$SIGNING_TEMP_DIR" != "$runner_temp/$signing_basename" \
            || ! -d "$SIGNING_TEMP_DIR" \
            || -L "$SIGNING_TEMP_DIR" ]]; then
            echo "Prepared signing workspace is unsafe" >&2
            exit 64
          fi
          EXPECTED_KEYCHAIN_PATH="$SIGNING_TEMP_DIR/switchtab-release.keychain-db"
          if [[ "$NOTARYTOOL_KEYCHAIN_PATH" != "$EXPECTED_KEYCHAIN_PATH" ]]; then
            echo "Prepared signing Keychain path is unsafe" >&2
            exit 64
          fi

          required_names=(
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_NOTARY_KEY_P8_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
          )
          for required_name in "${required_names[@]}"; do
            required_value="${!required_name}"
            if [[ -z "$required_value" ]]; then
              echo "Required Apple release credential is missing" >&2
              exit 64
            fi
          done
          required_value=''

          umask 077
          KEYCHAIN_PATH="$NOTARYTOOL_KEYCHAIN_PATH"
          CERTIFICATE_PATH="$SIGNING_TEMP_DIR/switchtab-release-certificate.p12"
          NOTARY_KEY_PATH="$SIGNING_TEMP_DIR/switchtab-notary-auth-key.p8"
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$NOTARY_KEY_PATH"

          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          /usr/bin/security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          existing_keychains=()
          while IFS= read -r existing_keychain; do
            if [[ -n "$existing_keychain" && "$existing_keychain" != "$KEYCHAIN_PATH" ]]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < <(
            /usr/bin/security list-keychains -d user \
              | /usr/bin/sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//'
          )
          /usr/bin/security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

          xcrun notarytool store-credentials "$NOTARYTOOL_KEYCHAIN_PROFILE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Build notarized DMG
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY }}"
          DEVELOPER_ID_APPLICATION: "${{ vars.DEVELOPER_ID_APPLICATION }}"
        run: scripts/build-direct-distribution.sh --release

      - name: Generate signed appcast
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY }}"
          SPARKLE_PRIVATE_ED_KEY: "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}"
          UPDATE_DOMAIN: updates.switchtab.app
        run: scripts/generate-appcast.sh

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          R2_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          R2_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          R2_BUCKET_NAME: switchtab-updates
          UPDATE_DOMAIN: updates.switchtab.app
        run: scripts/publish-release.sh "$RELEASE_TAG"

      - name: Cleanup Apple credentials
        if: always()
        shell: bash
        run: |
          set +x
          set -u
          runner_temp="${RUNNER_TEMP:-}"
          signing_temp_dir="${SIGNING_TEMP_DIR:-}"
          keychain_path="${NOTARYTOOL_KEYCHAIN_PATH:-}"
          if [[ -z "$runner_temp" || -z "$signing_temp_dir" ]]; then
            exit 0
          fi
          signing_basename="${signing_temp_dir#"$runner_temp"/}"
          case "$signing_temp_dir" in
            "$runner_temp"/switchtab-release.*) ;;
            *) exit 0 ;;
          esac
          if [[ ! "$signing_basename" =~ ^switchtab-release[.][A-Za-z0-9]{6}$ \
            || "$signing_temp_dir" != "$runner_temp/$signing_basename" \
            || ! -d "$signing_temp_dir" \
            || -L "$signing_temp_dir" ]]; then
            exit 0
          fi
          expected_keychain_path="$signing_temp_dir/switchtab-release.keychain-db"
          if [[ "$keychain_path" == "$expected_keychain_path" && -e "$keychain_path" ]]; then
            /usr/bin/security delete-keychain "$keychain_path" 2>/dev/null || true
          fi
          rm -f -- "$signing_temp_dir/switchtab-release-certificate.p12" || true
          rm -f -- "$signing_temp_dir/switchtab-notary-auth-key.p8" || true
          rmdir "$signing_temp_dir" || true
