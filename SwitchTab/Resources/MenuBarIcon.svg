<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>SwitchTab stacked windows menu bar icon</title>
  <defs>
    <mask id="back-window-visibility" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="white"/>
      <rect x="7" y="7" width="21" height="19" rx="3" fill="black"/>
    </mask>
    <mask id="middle-window-visibility" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="white"/>
      <rect x="12" y="12" width="21" height="19" rx="3" fill="black"/>
    </mask>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <rect
      id="back-window"
      data-role="window-outline"
      x="2"
      y="2"
      width="21"
      height="19"
      rx="3"
      mask="url(#back-window-visibility)"
    />
    <rect
      id="middle-window"
      data-role="window-outline"
      x="7"
      y="7"
      width="21"
      height="19"
      rx="3"
      mask="url(#middle-window-visibility)"
    />
    <rect
      id="front-window"
      data-role="window-outline"
      x="12"
      y="12"
      width="21"
      height="19"
      rx="3"
    />
  </g>

  <circle
    id="front-status-dot"
    data-role="front-status-dot"
    cx="15.5"
    cy="16"
    r="1.3"
    fill="currentColor"
  />
  <rect
    id="wide-pane"
    data-role="front-pane"
    x="14"
    y="21"
    width="10"
    height="6"
    rx="1"
    fill="currentColor"
  />
  <rect
    id="narrow-pane"
    data-role="front-pane"
    x="26"
    y="21"
    width="4"
    height="6"
    rx="1"
    fill="currentColor"
  />
</svg>
